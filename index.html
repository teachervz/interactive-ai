<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الذكاء الاصطناعي – عرض تفاعلي</title>
<!-- خط عربي واضح (يعمل مع الإنترنت، وإن لم يتوفر يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&family=Cairo:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والهوية البصرية
   ========================================================= */
:root{
  --p:#7C3AED;  --p2:#8B5CF6; --p3:#C4B5FD; --p4:#EDE9FE; --p5:#F7F4FF;
  --deep:#4C1D95; --ink:#2E1065; --muted:#6B5B95;
  --amber:#F59E0B; --amber-l:#FEF3C7;
  --mint:#10B981;  --mint-l:#D1FAE5;
  --rose:#F43F5E;  --rose-l:#FFE4E6;
  --sky:#0EA5E9;   --sky-l:#E0F2FE;
  --pink:#EC4899;  --pink-l:#FCE7F3;
  --card:#FFFFFF;
  --shadow:0 12px 34px rgba(76,29,149,.13);
  --font:'Cairo','Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,Menlo,'Cairo',Tahoma,monospace;
}
/* إيقاف دمج الرموز (مثل >= إلى ≥) حتى ترى الطالبات الرموز كما تُكتب */
.mono{font-variant-ligatures:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1B0B36;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.idle{cursor:none}
button{font-family:inherit}

/* =========================================================
   2) المسرح 16:9 (1920×1080) يتم تكبيره/تصغيره ليملأ الشاشة
   ========================================================= */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(circle at 6% 8%, #EDE9FE 0, transparent 32%),
    radial-gradient(circle at 96% 92%, #FCE7F3 0, transparent 30%),
    radial-gradient(circle at 92% 6%, #E0F2FE 0, transparent 22%),
    #FBFAFF;}
#progress{position:absolute;top:0;right:0;height:8px;background:linear-gradient(90deg,var(--pink),var(--p));border-radius:0 0 0 8px;transition:width .6s ease;z-index:5}

/* الشريحة */
.slide{position:absolute;inset:0;padding:56px 100px 130px;display:flex;flex-direction:column;visibility:hidden;opacity:0}
.slide.active{visibility:visible;opacity:1;z-index:2}
.slide.leaving{visibility:visible;z-index:1;animation:outFade .45s ease both}
.slide.enter-fade{animation:inFade .7s ease both}
.slide.enter-zoom{animation:inZoom .7s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-slide.fwd{animation:inSlideF .7s cubic-bezier(.2,.8,.2,1) both}
.slide.enter-slide.back{animation:inSlideB .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inZoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes inSlideF{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes inSlideB{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes outFade{from{opacity:1}to{opacity:0;transform:scale(.985)}}

/* ظهور العناصر بالتتابع */
.slide.active .st{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 110ms + 200ms)}
/* نستخدم خاصية translate (وليس transform) حتى لا تتعارض مع حركات hover ومواضع العناصر */
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}

/* رأس الشريحة */
.s-head{display:flex;gap:16px;align-items:center;margin-bottom:10px;min-height:52px}
.badge{background:var(--p);color:#fff;font-weight:800;font-size:26px;padding:6px 24px;border-radius:999px;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.chip{background:#fff;color:var(--p);border:3px solid var(--p3);font-weight:800;font-size:26px;padding:4px 22px;border-radius:999px}
.s-title{font-size:64px;font-weight:900;margin:0 0 26px;line-height:1.25;color:var(--ink)}
.s-title .hl{color:var(--p)}
.s-body{flex:1;min-height:0;position:relative}

/* أزرار عامة */
.btn{font-size:32px;font-weight:800;border:none;border-radius:22px;padding:14px 34px;background:var(--p);color:#fff;cursor:pointer;
  box-shadow:0 6px 0 #5B21B6, 0 12px 24px rgba(124,58,237,.25);transition:transform .15s, box-shadow .15s, background .2s;line-height:1.4}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5B21B6}
.btn.soft{background:#fff;color:var(--p);box-shadow:0 6px 0 var(--p3), 0 10px 20px rgba(124,58,237,.12);border:3px solid var(--p3)}
.btn.amber{background:var(--amber);box-shadow:0 6px 0 #B45309}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 #047857}
.btn.rose{background:var(--rose);box-shadow:0 6px 0 #BE123C}
.btn.sm{font-size:26px;padding:10px 24px;border-radius:18px}
.btn:focus-visible,.opt:focus-visible,.card-btn:focus-visible{outline:5px solid var(--amber);outline-offset:4px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:30px 36px}
.row{display:flex;gap:28px}
.col{display:flex;flex-direction:column;gap:22px}
.center{display:flex;align-items:center;justify-content:center}
.muted{color:var(--muted)}
.big{font-size:40px;line-height:1.6}
.mid{font-size:34px;line-height:1.6}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono)}

/* عناصر تظهر عند الضغط */
.rv{opacity:0;transform:translateY(18px) scale(.97);transition:all .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.rv.show{opacity:1;transform:none;pointer-events:auto}
.peek{cursor:pointer;position:relative}
.peek .peek-a{display:none}
.peek.open .peek-a{display:block;animation:rise .45s both}
.peek.open .peek-q{display:none}

/* أيقونات تتحرك بلطف */
.float{display:inline-block;animation:floaty 3.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s both !important}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* =========================================================
   3) شريط التحكم + المؤشرات
   ========================================================= */
/* شريط تحكم صغير في الزاوية السفلية اليسرى */
#controls{position:fixed;left:14px;bottom:14px;display:flex;align-items:center;gap:5px;direction:ltr;
  background:rgba(46,16,101,.85);backdrop-filter:blur(10px);padding:5px 7px;border-radius:999px;z-index:50;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .4s, transform .4s}
#controls button{border:none;background:rgba(255,255,255,.12);color:#fff;font-size:clamp(12px,.9vw,15px);font-weight:800;
  padding:5px 11px;border-radius:999px;cursor:pointer;transition:background .2s, transform .15s}
#controls button:hover{background:rgba(255,255,255,.28)}
#controls button:active{transform:scale(.92)}
#controls #btnClap{background:var(--amber);font-size:clamp(14px,1.1vw,18px);padding:3px 10px}
#counter{color:#fff;font-weight:800;font-size:clamp(12px,.9vw,15px);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#hint{position:fixed;top:14px;left:16px;z-index:50;background:rgba(46,16,101,.78);color:#fff;font-size:clamp(12px,1vw,16px);font-weight:700;
  padding:6px 16px;border-radius:999px;direction:rtl;transition:opacity .4s;pointer-events:none}
#hint b{color:#FDE68A}
body.idle #controls{opacity:0;transform:translateY(20px);pointer-events:none}
body.idle #hint{opacity:0}

/* ملاحظات المعلمة (زر N) */
#notes{position:fixed;top:60px;left:16px;width:min(460px,40vw);max-height:60vh;overflow:auto;background:#fff;color:var(--ink);z-index:60;border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);padding:18px 22px;font-size:18px;line-height:1.8;display:none;border-top:6px solid var(--amber)}
#notes.show{display:block;animation:rise .3s both}
#notes h4{margin:0 0 6px;font-size:20px}

/* طبقات المؤثرات */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#clapLayer{position:fixed;inset:0;pointer-events:none;z-index:71;overflow:hidden}
.clap-fly{position:absolute;font-size:44px;animation:flyUp var(--t,1.6s) ease-out forwards;will-change:transform,opacity}
@keyframes flyUp{0%{transform:translate(0,0) scale(.5) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--x,0px),-60vh) scale(1.3) rotate(var(--r,0deg));opacity:0}}
#toast{position:fixed;top:24px;left:50%;transform:translate(-50%,-250%);background:#fff;color:var(--ink);font-weight:800;font-size:clamp(18px,1.6vw,28px);
  padding:12px 30px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.25);z-index:80;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#toast.show{transform:translate(-50%,0)}

/* =========================================================
   4) مكونات الشرائح
   ========================================================= */

/* --- الشريحة الترحيبية --- */
.title-wrap{display:flex;align-items:center;justify-content:space-between;height:100%;gap:40px}
.kicker{font-size:34px;font-weight:800;color:var(--p);background:var(--p4);display:inline-block;padding:6px 26px;border-radius:999px}
.title-wrap h1{font-size:140px;font-weight:900;margin:10px 0 0;line-height:1.3;padding-bottom:.18em;
  background:linear-gradient(90deg,var(--p),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.title-wrap .sub{font-size:48px;font-weight:700;margin:6px 0 30px;color:var(--muted)}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:34px}
.meta span{background:#fff;border-radius:18px;padding:10px 24px;font-size:30px;font-weight:700;box-shadow:var(--shadow)}
.orbit-wrap{position:relative;width:660px;height:660px;flex:none}
.orbit-core{position:absolute;inset:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--p4) 60%,var(--p3));
  display:grid;place-items:center;font-size:190px;box-shadow:0 30px 70px rgba(124,58,237,.35)}
.orbit-ring{position:absolute;inset:20px;border:4px dashed var(--p3);border-radius:50%;animation:spin 50s linear infinite}
.orbit-ring span{position:absolute;width:104px;height:104px;margin:-52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:54px;
  box-shadow:var(--shadow);animation:spin 50s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- مراجعة الدرس السابق: بطاقات المفاهيم + المحاكيات --- */
.review-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:34px;height:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ctile{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-bottom:6px solid var(--p3);text-align:center;min-height:150px;
  display:flex;flex-direction:column;justify-content:center;transition:transform .2s, border-color .2s}
.ctile:hover{transform:translateY(-4px)}
.ctile.open{border-bottom-color:var(--p)}
.ctile .ci{font-size:46px;line-height:1.2}
.ctile b{font-size:29px}
.ctile .peek-q{font-size:20px;color:var(--muted);font-weight:700}
.ctile .peek-a{font-size:23px;font-weight:700;color:var(--p);line-height:1.45;margin-top:4px}
.task{background:var(--amber-l);border-radius:22px;padding:16px 24px;font-size:29px;font-weight:700;line-height:1.6;border-right:10px solid var(--amber)}

.sim{background:#fff;border-radius:26px;box-shadow:0 20px 50px rgba(46,16,101,.18);overflow:hidden;display:flex;flex-direction:column;height:100%;border:3px solid var(--p4)}
.sim-head{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--c,#0078D4);color:#fff;font-size:26px;font-weight:800}
.dots3{display:flex;gap:8px;direction:ltr}
.dots3 i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.55)}
.sim-body{flex:1;min-height:0;padding:18px;position:relative;background:#F6F8FF}
.sim-foot{padding:12px 20px;background:#fff;border-top:2px solid var(--p4);font-size:25px;font-weight:700;line-height:1.5;min-height:74px;display:flex;align-items:center;gap:12px}
.sim-foot .msg{flex:1}
.empty-s{color:#9CA3AF;font-size:22px;font-weight:700;text-align:center;margin:auto 0;padding:10px}

/* نشاط التصنيف: نظام تحكم مفتوح أم مغلق؟ */
.sort{display:flex;flex-direction:column;gap:14px}
.scard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 22px;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:4px;border-right:10px solid var(--p);animation:pop .4s both}
.scard .scnt{font-size:20px;font-weight:800;color:var(--muted)}
.scard .stx{font-size:30px;font-weight:800;line-height:1.5;color:var(--ink)}
.bins{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{font-family:inherit;background:#fff;border:4px dashed var(--c);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;cursor:pointer;text-align:start;transition:transform .15s,background .2s}
.bin:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--c) 8%,#fff)}
.bin .bh{font-size:28px;font-weight:900;text-align:center;color:color-mix(in srgb,var(--c) 75%,#000)}
.bin small{font-size:19px;font-weight:700;color:var(--muted);text-align:center}
.bin .bl{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.bin .bl div{font-size:18px;font-weight:700;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:12px;padding:6px 10px;animation:pop .35s both}

/* التمهيد: اجتماع Teams مع ترجمة فورية */
.meet-big{background:#1B1A2E;border-radius:28px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(27,26,46,.35)}
.mb-top{display:flex;justify-content:space-between;color:#E5E7EB;font-size:23px;font-weight:800;padding:14px 22px;background:#26253B}
.mb-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;min-height:0}
.mb-av{width:190px;height:190px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#EC4899);display:grid;place-items:center;font-size:110px;box-shadow:0 0 0 0 rgba(236,72,153,.6)}
.talking .mb-av{animation:ring 1s infinite}
@keyframes ring{70%{box-shadow:0 0 0 26px rgba(236,72,153,0)}100%{box-shadow:0 0 0 0 rgba(236,72,153,0)}}
.mb-name{font-size:26px;font-weight:800;direction:ltr}
.talking .wave span{animation:wv .8s ease-in-out infinite}
.mb-cap{background:rgba(0,0,0,.55);padding:14px 26px;min-height:150px}
.mb-cap .en{color:#E5E7EB;font-size:26px;font-family:'Segoe UI',system-ui,sans-serif;text-align:left;line-height:1.45}
.mb-cap .ar{color:#FDE68A;font-size:36px;font-weight:800;line-height:1.5;min-height:54px;margin-top:6px}
.mb-cap .ar:empty::before{content:"🌐 الترجمة المباشرة متوقفة";color:#6B7280;font-size:24px;font-weight:700}
.mb-ctl{display:flex;gap:12px;justify-content:center;padding:14px;background:#26253B;flex-wrap:wrap}

/* --- قصة الجسر (ماذا تتوقعين؟) --- */
.story{display:flex;flex-direction:column;gap:18px}
.story .rv{font-size:32px;line-height:1.55;background:#fff;border-radius:22px;padding:16px 26px;box-shadow:var(--shadow);border-right:8px solid var(--p3)}
.story .rv.key{background:linear-gradient(90deg,var(--p),var(--pink));color:#fff;border:none;font-weight:800;font-size:36px}

/* --- الأهداف --- */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
.goal{display:flex;align-items:center;gap:22px;background:#fff;border-radius:26px;padding:22px 28px;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;border:3px solid transparent}
.goal .gi{width:86px;height:86px;flex:none;border-radius:24px;display:grid;place-items:center;font-size:48px;background:var(--p4)}
.goal p{margin:0;font-size:33px;font-weight:700;line-height:1.5}
.goal .tick{margin-inline-start:auto;font-size:40px;opacity:.15;transition:all .3s}
.goal.done{border-color:var(--mint);background:#F0FDF7}
.goal.done .tick{opacity:1;transform:scale(1.2)}
.goal.full{grid-column:1 / -1}
.goal-lead{font-size:34px;font-weight:800;color:var(--muted);margin:-6px 0 18px}

/* --- العصف الذهني --- */
.bs-grid{display:grid;grid-template-columns:1fr 330px;gap:30px;height:100%}
.bs-q{font-size:44px;font-weight:900;text-align:center;color:var(--deep);background:#fff;border-radius:30px;padding:20px;box-shadow:var(--shadow)}
.bs-input{display:flex;gap:14px}
.bs-input input{flex:1;font-family:inherit;font-size:32px;padding:12px 24px;border-radius:20px;border:3px solid var(--p3);outline:none;color:var(--ink);-webkit-user-select:text;user-select:text}
.bs-input input:focus{border-color:var(--p)}
.bubbles{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:16px;padding:20px;background:rgba(255,255,255,.6);
  border:4px dashed var(--p3);border-radius:30px;overflow:hidden;min-height:0}
.bubble{font-size:32px;font-weight:800;padding:10px 26px;border-radius:999px;animation:pop .5s both;box-shadow:0 6px 14px rgba(0,0,0,.08);cursor:pointer}
.bubbles .empty{font-size:30px;color:var(--muted);align-self:center;margin:auto}

/* --- المؤقت --- */
.timer{display:flex;flex-direction:column;align-items:center;gap:12px}
.timer .ring{position:relative;width:230px;height:230px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:12}
.timer .bg{stroke:var(--p4)}
.timer .fg{stroke:var(--p);stroke-linecap:round;transition:stroke-dashoffset 1s linear, stroke .3s}
.timer.warn .fg{stroke:var(--rose)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.timer.warn .num{color:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.timer .tb{display:flex;gap:10px}
.timer.sm .ring{width:170px;height:170px}
.timer.sm .num{font-size:44px}
.timer .lbl{font-size:26px;font-weight:800;color:var(--muted)}

/* --- التعريف بالفراغات --- */
.def{font-size:50px;font-weight:800;line-height:2.1;text-align:center;background:#fff;border-radius:34px;padding:34px 50px;box-shadow:var(--shadow)}
.blank{font:inherit;font-size:46px;min-width:200px;border:none;border-bottom:6px dashed var(--p);background:var(--p4);color:var(--p);border-radius:14px;padding:0 20px;cursor:pointer;margin:0 6px;transition:all .3s}
.blank.on{background:linear-gradient(90deg,var(--p),var(--pink));color:#fff;border-bottom-color:transparent;animation:pop .5s both}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:30px}
.pair{background:#fff;border-radius:26px;padding:20px;text-align:center;box-shadow:var(--shadow);min-height:200px;display:flex;flex-direction:column;justify-content:center}
.pair .ic{font-size:60px}
.pair .t1{font-size:30px;font-weight:800}
.pair .peek-a{font-size:27px;font-weight:700;color:var(--p);margin-top:6px}
.pair .peek-q{font-size:24px;color:var(--muted);margin-top:6px}

/* --- مقارنة البرنامج العادي وتعلّم الآلة --- */
.flow{display:flex;align-items:center;gap:18px;background:#fff;border-radius:30px;padding:22px 30px;box-shadow:var(--shadow)}
.flow h3{margin:0;font-size:34px;width:300px;flex:none;line-height:1.4}
.flow h3 small{display:block;font-size:24px;color:var(--muted);font-weight:700}
.fbox{flex:1;border-radius:22px;padding:14px 10px;text-align:center;font-size:30px;font-weight:800;background:var(--p5);border:3px solid var(--p4)}
.fbox i{font-style:normal;display:block;font-size:48px}
.fbox.me{background:var(--amber-l);border-color:#FCD34D}
.fbox.out{background:var(--mint-l);border-color:#6EE7B7}
.fbox.brain{background:var(--pink-l);border-color:#F9A8D4}
.farrow{font-size:46px;color:var(--p3);font-weight:900}

/* --- مختبر تعلّم الآلة --- */
.lab{display:grid;grid-template-columns:1040px 1fr;gap:34px;height:100%}
.lab-canvas{position:relative;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:16px 16px 54px 70px;align-self:start}
.lab-canvas canvas{display:block;width:954px;height:560px;border-radius:16px;cursor:crosshair}
.axis-x{position:absolute;bottom:10px;left:70px;right:16px;text-align:center;font-size:24px;font-weight:800;color:var(--muted)}
.axis-y{position:absolute;left:14px;top:16px;height:560px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:24px;font-weight:800;color:var(--muted)}
.mode-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mode{font-size:26px;font-weight:800;padding:14px 8px;border-radius:20px;border:4px solid transparent;cursor:pointer;background:#fff;box-shadow:var(--shadow);transition:all .2s}
.mode.on{border-color:var(--p);transform:translateY(-3px)}
.mode.spam{color:var(--rose)}.mode.ham{color:#059669}.mode.test{color:var(--p)}
.lab-info{font-size:28px;line-height:1.6;background:#fff;border-radius:24px;padding:18px 24px;box-shadow:var(--shadow)}
.lab-info b{color:var(--p)}
.pred{font-size:34px;font-weight:900;text-align:center;border-radius:22px;padding:14px;background:var(--p4);min-height:76px}
.lab-tools{display:flex;flex-wrap:wrap;gap:12px}

/* --- شرح خطوات تعلّم الآلة --- */
.mlpipe{display:flex;gap:8px;align-items:stretch}
.mstep{flex:1;background:#fff;border:3px solid var(--p4);border-radius:22px;padding:12px 6px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .25s, background .25s, border-color .25s, color .25s;font-family:inherit;color:var(--ink);position:relative}
.mstep:hover{transform:translateY(-4px)}
.mstep .mi{font-size:44px;line-height:1.3}
.mstep .mn{display:block;font-size:22px;font-weight:800;line-height:1.3}
.mstep .mk{position:absolute;top:-16px;right:50%;margin-right:-17px;width:34px;height:34px;border-radius:50%;background:var(--p3);color:#fff;font-size:19px;font-weight:900;display:grid;place-items:center}
.mstep.done{border-color:var(--p3);background:var(--p5)}
.mstep.done .mk{background:var(--p)}
.mstep.cur{border-color:var(--p);background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;transform:translateY(-10px);box-shadow:0 16px 30px rgba(124,58,237,.35)}
.mstep.cur .mk{background:var(--amber)}
.marr{align-self:center;color:var(--p3);font-size:28px;font-weight:900}
.mhead{font-size:46px;font-weight:900;text-align:center;margin:26px 0 18px;color:var(--deep);animation:rise .45s both}
.mdetail{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:20px}
.mbox{background:#fff;border-radius:26px;padding:18px 24px;box-shadow:var(--shadow);border-top:8px solid var(--c);animation:rise .45s both}
.mbox:nth-child(2){animation-delay:.1s}.mbox:nth-child(3){animation-delay:.2s}
.mbox h4{margin:0 0 6px;font-size:27px;color:var(--c)}
.mbox p{margin:0;font-size:30px;font-weight:700;line-height:1.55}
.mnav{display:flex;gap:16px;justify-content:center;margin-top:24px}

/* --- ترتيب خطوات تعلّم الآلة --- */
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;min-height:120px}
.chipbtn{font-size:30px;font-weight:800;background:#fff;border:3px solid var(--p3);color:var(--ink);border-radius:22px;padding:14px 26px;cursor:pointer;box-shadow:0 6px 0 var(--p4);transition:all .2s}
.chipbtn:hover{transform:translateY(-3px);border-color:var(--p)}
.chipbtn.used{visibility:hidden}
.pipe{display:flex;gap:10px;align-items:stretch;margin-top:30px}
.slot{flex:1;min-height:250px;border-radius:24px;border:4px dashed var(--p3);background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;position:relative}
.slot .n{position:absolute;top:-22px;background:var(--p3);color:#fff;font-weight:900;font-size:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.slot.fill{border:4px solid var(--p);background:#fff;animation:pop .45s both;box-shadow:var(--shadow)}
.slot.fill .n{background:var(--p)}
.slot .si{font-size:50px}
.slot .sn{font-size:26px;font-weight:900;line-height:1.35}
.slot .sa{font-size:21px;font-weight:700;color:var(--muted);margin-top:8px;line-height:1.4}
.analogy{font-size:28px;font-weight:700;text-align:center;color:var(--muted);margin-top:22px}

/* --- بطاقات قابلة للقلب --- */
.flips{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;height:100%}
.flip{perspective:1200px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.flip .f{background:#fff;border-bottom:8px solid var(--c,var(--p3))}
.flip .f .ic{font-size:84px}
.flip .f h4{font-size:30px;margin:10px 0 0;line-height:1.35}
.flip .f small{font-size:20px;color:var(--muted);font-weight:700;margin-top:6px}
.flip .b{background:var(--c,var(--p));color:#fff;transform:rotateY(180deg);font-size:24px;font-weight:700;line-height:1.55}
.flip .b h4{font-size:27px;margin:0 0 8px}

/* --- التعرف على الكلام --- */
.speech{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;height:100%}
.sr-pipe{display:flex;align-items:center;gap:14px}
.sr-node{flex:1;background:#fff;border-radius:24px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.sr-node i{font-style:normal;font-size:56px;display:block}
.sr-node b{font-size:26px}
.sr-node small{display:block;font-size:21px;color:var(--muted);font-weight:700}
.wave{display:flex;gap:6px;justify-content:center;align-items:center;height:56px}
.wave span{width:9px;height:16px;background:var(--p);border-radius:6px}
.listening .wave span{animation:wv .8s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.1s!important}.wave span:nth-child(3){animation-delay:.2s!important}.wave span:nth-child(4){animation-delay:.3s!important}.wave span:nth-child(5){animation-delay:.4s!important}
@keyframes wv{50%{height:52px;background:var(--pink)}}
.listening .nn{animation:pulse 1s infinite}
.sr-text{font-size:44px;font-weight:900;background:#fff;border-radius:26px;padding:22px 30px;min-height:130px;box-shadow:var(--shadow);text-align:center;color:var(--deep);border:4px solid var(--p4)}
.mic{font-size:36px}
.ayn{background:#fff;border-radius:30px;padding:26px 30px;box-shadow:var(--shadow);height:100%;display:flex;flex-direction:column;gap:18px}
.ayn h3{margin:0;font-size:38px}
.ayn .w{font-size:96px;font-weight:900;text-align:center;color:var(--p);line-height:1.2}
.meanings{display:flex;gap:14px;justify-content:center}
.meanings .rv{background:var(--p5);border-radius:20px;padding:12px 18px;text-align:center;font-size:28px;font-weight:800;border:3px solid var(--p4)}
.meanings .rv i{display:block;font-style:normal;font-size:44px}

/* --- القيادة الذاتية --- */
.drive{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%}
.levels{display:flex;flex-direction:column;gap:18px}
.lvl{display:flex;align-items:center;gap:20px;background:#fff;border-radius:26px;padding:18px 26px;box-shadow:var(--shadow);cursor:pointer;border:4px solid transparent;font-size:32px;font-weight:800;transition:all .25s;text-align:right}
.lvl .dot{width:30px;height:30px;border-radius:50%;flex:none}
.lvl.on{border-color:var(--p);transform:translateX(-10px)}
.road{position:relative;height:300px;border-radius:30px;background:#3F3D56;overflow:hidden;box-shadow:var(--shadow)}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:repeating-linear-gradient(90deg,#fff 0 60px,transparent 60px 120px);animation:lane 1s linear infinite;opacity:.8}
.road.l1::before{animation-duration:2s}.road.l3::before{animation-duration:.5s}
@keyframes lane{to{background-position:-120px 0}}
.car{position:absolute;top:50%;left:50%;font-size:130px;transform:translate(-50%,-55%) scaleX(-1);transition:all .6s}
.driver{position:absolute;top:18px;right:22px;background:#fff;border-radius:999px;padding:8px 22px;font-size:28px;font-weight:800}
.ldesc{font-size:33px;line-height:1.65;background:#fff;border-radius:26px;padding:22px 28px;box-shadow:var(--shadow);margin-top:22px;min-height:190px}

/* --- فكري زاوجي شاركي --- */
.tps-q{font-size:48px;font-weight:900;text-align:center;background:linear-gradient(90deg,var(--p),var(--pink));color:#fff;border-radius:30px;padding:24px 30px;margin-bottom:30px}
.tps{display:grid;grid-template-columns:1fr 1fr 1fr 300px;gap:24px;align-items:stretch}
.phase{background:#fff;border-radius:30px;padding:26px;text-align:center;box-shadow:var(--shadow);border:5px solid transparent;cursor:pointer;transition:all .3s}
.phase .pi{font-size:84px}
.phase h3{font-size:42px;margin:6px 0}
.phase p{font-size:28px;margin:0;color:var(--muted);font-weight:700;line-height:1.5}
.phase.on{border-color:var(--p);transform:translateY(-10px);box-shadow:0 22px 40px rgba(124,58,237,.25)}

/* --- جدول التأثيرات --- */
.etable{display:grid;grid-template-columns:230px 1fr 1fr;gap:16px}
.etable .h{font-size:34px;font-weight:900;text-align:center;padding:12px;border-radius:20px}
.etable .rh{font-size:32px;font-weight:900;background:var(--p);color:#fff;border-radius:22px;display:grid;place-items:center}
.cell{background:#fff;border-radius:22px;padding:16px 22px;font-size:26px;line-height:1.55;font-weight:700;box-shadow:var(--shadow);min-height:136px;display:flex;align-items:center}
.cell .peek-q{width:100%;text-align:center;font-size:54px;color:var(--p3)}
.cell.pos{border-right:10px solid var(--mint)}.cell.neg{border-right:10px solid var(--rose)}

/* --- المجموعات التعاونية --- */
.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.grp{border-radius:28px;padding:20px;color:#fff;text-align:center;cursor:pointer;min-height:300px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);transition:transform .2s}
.grp:hover{transform:translateY(-5px)}
.grp .gi{font-size:64px}
.grp h3{font-size:36px;margin:4px 0 10px}
.grp .peek-q{font-size:24px;opacity:.85;margin-top:auto;margin-bottom:auto}
.grp .peek-a{font-size:24px;line-height:1.55;font-weight:700;background:rgba(255,255,255,.18);border-radius:18px;padding:12px}
.fact{background:var(--mint-l);border-radius:26px;padding:16px 28px;font-size:29px;font-weight:700;line-height:1.55;border-right:10px solid var(--mint)}

/* --- ربط بالقيم والوطن --- */
.verse{font-family:'Amiri','Traditional Arabic','Cairo',serif;font-weight:700;font-size:34px;line-height:1.9;color:var(--deep);text-align:center;
  background:var(--p5);border-radius:18px;padding:4px 14px}
.verse small{display:block;font-family:var(--font);font-size:19px;color:var(--muted);line-height:1.4}
.art34{display:flex;gap:22px;align-items:center;background:linear-gradient(90deg,#065F46,#059669);color:#fff;border-radius:28px;padding:16px 30px;margin-bottom:22px;box-shadow:0 12px 30px rgba(5,150,105,.3)}
.art34 .lbl{font-size:23px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 18px;white-space:nowrap}
.art34 p{margin:0;font-size:32px;font-weight:800;line-height:1.55}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.val{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:16px 22px;border-top:9px solid var(--c);display:flex;flex-direction:column;gap:10px}
.val h3{margin:0;font-size:36px;color:var(--c)}
.val ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.val li{font-size:24px;font-weight:700;line-height:1.5;padding-inline-start:14px;border-inline-start:5px solid var(--c)}
.val .btn{align-self:flex-start;margin-top:auto}

/* --- المساعد الشخصي الافتراضي --- */
.asst{display:grid;grid-template-columns:1fr 470px;gap:34px;height:100%}
.brands{display:flex;gap:12px;flex-wrap:wrap}
.brands span{background:#fff;border:3px solid var(--p4);border-radius:999px;padding:4px 20px;font-size:25px;font-weight:800;direction:ltr}
.more{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.more .mbox p{font-size:24px}
.warnbox{background:var(--rose-l);border-right:10px solid var(--rose);border-radius:20px;padding:12px 22px;font-size:25px;font-weight:800;line-height:1.55;color:#9F1239}
.phone{height:100%;max-height:744px;background:#16141F;border-radius:54px;padding:14px;box-shadow:0 24px 50px rgba(22,20,31,.35)}
.pscreen{height:100%;border-radius:42px;background:linear-gradient(#EEF2FF,#fff);display:flex;flex-direction:column;padding:18px 16px;overflow:hidden}
.ptop{text-align:center;font-size:24px;font-weight:900;color:var(--p);padding-bottom:8px;border-bottom:2px solid var(--p4)}
.pchat{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:10px 0;overflow:hidden}
.bub{max-width:88%;border-radius:20px;padding:10px 16px;font-size:23px;font-weight:700;line-height:1.5;animation:rise .35s both}
.bub.me{align-self:flex-start;background:var(--p);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-end;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.08);border-bottom-left-radius:6px}
.bub.typing{color:var(--muted);letter-spacing:4px}
.pq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pq button{font-family:inherit;font-size:20px;font-weight:800;border:2px solid var(--p3);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.pq button:hover{background:var(--p5)}
.pmic{margin:12px auto 0;width:78px;height:78px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p),var(--pink));font-size:36px;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,.35)}
.pmic.on{animation:ring 1s infinite}

/* --- الروبوت --- */
.rob{display:grid;grid-template-columns:1fr 1fr;gap:30px;height:100%}
.build{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:18px 22px;display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:center}
.build h4,.lanes h4{margin:0 0 10px;font-size:30px}
.comps{display:flex;flex-direction:column;gap:10px}
.comp{display:flex;align-items:center;gap:10px;font-family:inherit;font-size:24px;font-weight:800;background:var(--p5);border:3px solid var(--p4);border-radius:18px;padding:8px 14px;cursor:pointer;color:var(--ink);transition:all .2s;text-align:right}
.comp:hover{border-color:var(--p3)}
.comp.on{background:var(--mint-l);border-color:var(--mint)}
.comp.on::after{content:"✅";margin-inline-start:auto}
.rfig{text-align:center}
.rfig .rb{font-size:150px;filter:grayscale(1) opacity(.35);transition:filter .6s;display:inline-block}
.rfig.alive .rb{filter:none;animation:floaty 2s ease-in-out infinite}
.rfig .rparts{font-size:34px;min-height:44px;letter-spacing:4px}
.rfig .rsay{font-size:21px;font-weight:800;color:var(--p);min-height:60px;line-height:1.45}
.lanes{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:150px;border-radius:20px;background:repeating-linear-gradient(90deg,#F1F5F9 0 40px,#E2E8F0 40px 80px);overflow:hidden}
.lane .ll{position:absolute;top:8px;right:14px;font-size:22px;font-weight:800;background:#fff;border-radius:999px;padding:2px 14px;z-index:2}
.lane .obs{position:absolute;bottom:14px;right:48%;font-size:60px}
.lane .flag{position:absolute;bottom:14px;left:3%;font-size:50px}
.lane .mv{position:absolute;bottom:14px;right:2%;font-size:64px}
.lane .boom{position:absolute;bottom:40px;right:40%;font-size:64px;opacity:0}
.lane .res{position:absolute;bottom:8px;left:12px;font-size:22px;font-weight:800;background:rgba(255,255,255,.9);border-radius:12px;padding:2px 12px;opacity:0;transition:opacity .4s;z-index:2}
.lanes.run .arm .mv{animation:armGo 1.4s ease-in forwards}
.lanes.run .arm .boom{animation:pop .4s 1.4s both}
.lanes.run .smart .mv{animation:robotGo 3.2s ease-in-out forwards}
.lanes .res.show{opacity:1}
@keyframes armGo{to{right:41%}}
@keyframes robotGo{0%{right:2%;translate:0 0}38%{right:38%;translate:0 0}50%{right:47%;translate:0 -78px}62%{right:56%;translate:0 0}100%{right:84%;translate:0 0}}

/* --- الطائرة المسيّرة --- */
.dro{display:grid;grid-template-columns:1fr 1.05fr;gap:30px;height:100%}
.cgrid.c3{grid-template-columns:repeat(3,1fr);gap:14px}
.cgrid.c3 .ctile{min-height:132px;padding:10px 12px}
.cgrid.c3 .ctile .ci{font-size:40px}
.cgrid.c3 .ctile b{font-size:25px}
.cgrid.c3 .ctile .peek-a{font-size:21px}
.dq{background:var(--amber-l);border-right:10px solid var(--amber);border-radius:20px;padding:12px 22px;font-size:29px;font-weight:800}
.dphoto{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 20px 44px rgba(46,16,101,.25);line-height:0}
.dphoto img{width:100%;height:auto;display:block}
.hot{position:absolute;translate:-50% -50%;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:var(--p);color:#fff;
  font-family:inherit;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 0 0 rgba(124,58,237,.7);animation:hotPulse 2s infinite;transition:background .2s, scale .2s}
.hot:hover{scale:1.12}
.hot.seen{background:var(--mint);animation:none}
.hot.on{background:var(--amber);scale:1.18;animation:none}
@keyframes hotPulse{70%{box-shadow:0 0 0 18px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.dcap{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px 24px;font-size:28px;font-weight:700;line-height:1.6;min-height:110px}
.dcap b{color:var(--p);margin-inline-end:8px}

/* --- جهود المملكة --- */
.kbanner{background:linear-gradient(90deg,#065F46,#059669);color:#fff;border-radius:26px;padding:16px 30px;font-size:32px;font-weight:700;line-height:1.5;margin-bottom:24px;box-shadow:0 12px 30px rgba(5,150,105,.3)}
.ksa{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.kcard{background:#fff;border-radius:30px;box-shadow:var(--shadow);border-top:10px solid var(--c);padding:18px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .2s}
.kcard:hover{transform:translateY(-6px)}
.kcard .ki{font-size:70px;line-height:1.2}
.kcard h3{margin:4px 0 12px;font-size:40px;color:var(--c)}
.kcard .peek-q{font-size:29px;font-weight:800;color:var(--muted);line-height:1.5;margin:auto 0}
.kcard .peek-q::after{content:"👆 اضغطي للكشف";display:block;font-size:21px;color:var(--p3);margin-top:12px}
.kcard ul{margin:0;padding:0;list-style:none;text-align:right;display:flex;flex-direction:column;gap:10px;width:100%}
.kcard li{font-size:25px;font-weight:700;line-height:1.5;margin-bottom:12px;padding-inline-start:14px;border-inline-start:5px solid var(--c)}
.kfoot{margin-top:22px;text-align:center;font-size:34px;font-weight:900;color:#047857}

/* --- سؤال مهارات التفكير العليا --- */
.hots-top{display:flex;gap:26px;align-items:center;margin-bottom:22px}
.scen{flex:1;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:22px 30px;font-size:32px;line-height:1.6;font-weight:600;border-right:10px solid var(--amber)}
.hots{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.hq{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:20px 24px;border-top:9px solid var(--c);display:flex;flex-direction:column;gap:12px;min-height:330px}
.hq .lv{align-self:flex-start;background:var(--c);color:#fff;font-family:var(--font-head);font-weight:800;font-size:26px;border-radius:999px;padding:4px 20px}
.hq .qq{font-size:29px;font-weight:700;line-height:1.55;color:var(--ink)}
.hq .ans{margin-top:auto;background:var(--p5);border-radius:18px;padding:12px 16px;font-size:24px;font-weight:600;line-height:1.55;color:var(--ink)}
.hq .ans::before{content:"✅ إجابة نموذجية";display:block;font-size:19px;font-weight:800;color:var(--c);margin-bottom:4px}
.hots-btn{display:flex;justify-content:center;margin-top:22px}

/* --- اختيار من متعدد --- */
.qcard{background:#fff;border-radius:34px;padding:30px 40px;box-shadow:var(--shadow);font-size:48px;font-weight:900;line-height:1.5;text-align:center;color:var(--deep);margin-bottom:30px;position:relative}
.qnum{position:absolute;top:-24px;right:40px;background:var(--amber);color:#fff;font-size:26px;padding:4px 22px;border-radius:999px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.opt{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:800;background:#fff;color:var(--ink);border:4px solid var(--p4);border-radius:28px;padding:20px 30px;cursor:pointer;
  box-shadow:0 8px 0 var(--p4);transition:all .2s;text-align:right}
.opt:hover{transform:translateY(-4px);border-color:var(--p3)}
.opt .oi{font-size:52px;width:84px;height:84px;display:grid;place-items:center;background:var(--p5);border-radius:22px;flex:none}
.opt .ok{margin-inline-start:auto;font-size:40px;color:var(--p3);font-family:var(--mono)}
.opt.correct{background:var(--mint-l);border-color:var(--mint);box-shadow:0 8px 0 #6EE7B7;animation:pop .5s both}
.opt.wrong{background:var(--rose-l);border-color:var(--rose);box-shadow:0 8px 0 #FDA4AF;opacity:.6}
.opts.solved .opt:not(.correct){opacity:.4;pointer-events:none}
.fb{margin-top:26px;font-size:40px;font-weight:900;text-align:center;min-height:64px}
.fb .good{color:#059669}.fb .bad{color:var(--p)}
.fb small{display:block;font-size:29px;font-weight:700;color:var(--muted);margin-top:6px}
.qtools{position:absolute;left:0;bottom:-10px;display:flex;gap:12px}

/* --- صح أم خطأ --- */
.tf{max-width:1450px;margin:0 auto;width:100%}
.tf-card{background:#fff;border-radius:34px;padding:40px 50px;box-shadow:var(--shadow);text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
.tf-card .tn{font-size:28px;font-weight:800;color:var(--p)}
.tf-card .tt{font-size:46px;font-weight:800;line-height:1.55;margin-top:10px}
.tf-btns{display:flex;gap:30px;justify-content:center;margin-top:30px}
.tf-btns .btn{font-size:44px;padding:18px 70px}
.dots{display:flex;gap:14px;justify-content:center;margin-top:26px}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--p4);cursor:pointer;transition:all .2s}
.dots i.cur{transform:scale(1.3);background:var(--p3)}
.dots i.r{background:var(--mint)}.dots i.w{background:var(--rose)}

/* --- تحدي الدقيقة --- */
.ch{display:grid;grid-template-columns:1fr 380px;gap:34px;height:100%}
.ch-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:30px;text-align:center}
.ch-item{font-size:54px;font-weight:900;line-height:1.5;color:var(--deep);min-height:170px;display:flex;align-items:center}
.ch-btns{display:flex;gap:30px}
.ch-btns .btn{font-size:40px;padding:18px 44px}
.ch-side{display:flex;flex-direction:column;gap:22px}
.score{background:#fff;border-radius:30px;padding:24px;text-align:center;box-shadow:var(--shadow)}
.score b{display:block;font-size:90px;font-weight:900;color:var(--p);line-height:1.1}
.score span{font-size:28px;font-weight:800;color:var(--muted)}
.bar{height:26px;border-radius:999px;background:var(--p4);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--p));transition:width 1s linear}

/* --- خريطة المراجعة --- */
.map{position:relative;height:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--p3);stroke-width:5;stroke-dasharray:12 10}
.mcore{position:absolute;left:50%;top:50%;translate:-50% -50%;width:290px;height:290px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;display:grid;place-items:center;text-align:center;font-size:44px;font-weight:900;line-height:1.3;box-shadow:0 20px 50px rgba(124,58,237,.4)}
.mnode{position:absolute;translate:-50% -50%;width:430px;background:#fff;border-radius:26px;padding:16px 22px;box-shadow:var(--shadow);text-align:center;cursor:pointer;border-top:7px solid var(--c)}
.mnode h4{margin:0;font-size:32px}
/* عناصر الخريطة لها حركة ظهور خاصة (لأنها تستخدم translate للتوسيط) */
.slide.active .mnode,.slide.active .mcore{animation:mapIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 140ms + 250ms)}
@keyframes mapIn{from{opacity:0;scale:.8}to{opacity:1;scale:1}}
.mnode .peek-q{font-size:22px;color:var(--muted);font-weight:700}
.mnode .peek-a{font-size:24px;line-height:1.5;font-weight:700;color:var(--muted);margin-top:6px}
.picker{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:16px}
.picker .pn{font-size:56px;font-weight:900;color:var(--p);background:#fff;border-radius:24px;min-width:120px;text-align:center;padding:4px 18px;box-shadow:var(--shadow)}

/* --- تذكرة الخروج --- */
.exit{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.xcard{border-radius:30px;padding:26px;text-align:center;color:#fff;box-shadow:var(--shadow);min-height:290px}
.xcard .xn{font-size:110px;font-weight:900;line-height:1}
.xcard p{font-size:33px;font-weight:800;line-height:1.5;margin:10px 0 0}
.votes{display:flex;gap:22px;justify-content:center;margin-top:30px;align-items:center}
.vote{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--p4);border-radius:24px;padding:12px 26px;font-size:32px;font-weight:800;cursor:pointer;transition:transform .15s;color:var(--ink)}
.vote:active{transform:scale(.94)}
.vote b{background:var(--p);color:#fff;border-radius:14px;min-width:54px;padding:0 10px;font-size:30px}

/* --- الختام --- */
.closing{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:100%;align-items:center}
.hw{background:#fff;border-radius:34px;padding:30px 38px;box-shadow:var(--shadow)}
.hw h3{font-size:42px;margin:0 0 14px}
.hw li{font-size:33px;font-weight:700;line-height:1.65;margin-bottom:8px}
.motto{text-align:center}
.motto .big-emoji{font-size:130px}
.motto h2{font-size:62px;font-weight:900;margin:10px 0;line-height:1.45;padding-bottom:.12em;background:linear-gradient(90deg,var(--p),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto p{font-size:36px;font-weight:700;color:var(--muted);margin:0 0 26px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* =========================================================
   🎨 الهوية البصرية: «مختبر الذكاء الاصطناعي»
   خلفية فضائية داكنة + شبكة عصبية + ألوان نيون + بطاقات بيضاء متوهجة
   (لتغيير الألوان عدّلي المتغيرات في :root أدناه)
   ========================================================= */
:root{
  --p:#7C5CFF; --p2:#9B87FF; --p3:#B4A8FF; --p4:#E6E1FF; --p5:#F3F1FF;
  --cyan:#22D3EE; --cyan-l:#A5F3FC; --pink:#EC4899;
  --deep:#1E1B4B; --ink:#17153B; --muted:#5A5878;
  --on:#EEF1FF; --on-muted:#A7B0DA;                 /* ألوان النص فوق الخلفية الداكنة */
  --shadow:0 0 0 1px rgba(148,163,255,.30), 0 16px 40px rgba(2,6,23,.5);
  --font:'IBM Plex Sans Arabic','Cairo','Segoe UI',Tahoma,sans-serif;
  --font-head:'Alexandria','Cairo','Segoe UI',sans-serif;
}
html,body{background:#03050F}
#stage{background:
    radial-gradient(circle at 12% 8%, rgba(124,92,255,.40), transparent 38%),
    radial-gradient(circle at 92% 88%, rgba(34,211,238,.26), transparent 40%),
    radial-gradient(circle at 88% 6%, rgba(236,72,153,.18), transparent 28%),
    linear-gradient(160deg,#0B1030 0%,#070A1C 60%,#050716 100%);}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(148,163,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,255,.07) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
#neural{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.6}
#progress{height:6px;background:linear-gradient(90deg,var(--cyan),var(--p),#F472B6);box-shadow:0 0 18px rgba(34,211,238,.8)}

/* الخطوط */
.s-title,.title-wrap h1,.motto h2,.qcard,.mhead,.tps-q,.bs-q,.ch-item,.badge,.kicker,.mcore,.xcard .xn,.score b,.timer .num,
.slide h3,.slide h4,.def,.tf-card .tt,.kcard h3,.val h3{font-family:var(--font-head)}

/* العناوين فوق الخلفية الداكنة */
.s-title{color:var(--on);font-size:58px;font-weight:800}
.hl{background:linear-gradient(90deg,#22D3EE,#A78BFA 55%,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-title small,.s-title .muted{color:var(--on-muted)!important}
.badge{background:linear-gradient(90deg,#7C5CFF,#06B6D4);box-shadow:0 0 24px rgba(34,211,238,.35);font-size:24px}
.badge::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-inline-end:10px;vertical-align:middle;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.chip{background:rgba(34,211,238,.08);border:2px solid rgba(34,211,238,.55);color:var(--cyan-l)}

/* الأزرار: توهج نيون */
.btn{background:linear-gradient(135deg,#7C5CFF,#4F6BFF);box-shadow:0 6px 0 #3B2FB0,0 0 26px rgba(124,92,255,.45)}
.btn:active{box-shadow:0 2px 0 #3B2FB0}
.btn.amber{background:linear-gradient(135deg,#FBBF24,#F59E0B)}
.btn.mint{background:linear-gradient(135deg,#34D399,#10B981)}
.btn.rose{background:linear-gradient(135deg,#FB7185,#F43F5E)}

/* الشريحة الترحيبية */
.kicker{background:rgba(34,211,238,.1);color:var(--cyan-l);border:2px solid rgba(34,211,238,.4)}
.title-wrap h1{background:linear-gradient(90deg,#67E8F9,#A78BFA 50%,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-wrap .sub{color:var(--on-muted)}
.title-wrap h1{line-height:1.35;padding-bottom:.3em;margin-bottom:-.15em}
.meta span{background:rgba(255,255,255,.07);color:var(--on);border:1px solid rgba(148,163,255,.3);box-shadow:none}
.orbit-ring{border-color:rgba(103,232,249,.45)}
.orbit-ring span{background:rgba(15,20,50,.85);border:2px solid rgba(103,232,249,.5);box-shadow:0 0 20px rgba(34,211,238,.35)}
.orbit-core{background:radial-gradient(circle at 35% 30%,#fff,#C7D2FE 45%,#7C5CFF);box-shadow:0 0 80px rgba(124,92,255,.7),0 0 0 14px rgba(124,92,255,.15),0 0 0 28px rgba(34,211,238,.08)}

/* نصوص تقع مباشرة على الخلفية الداكنة */
.goal-lead,.analogy,.bubbles .empty,.bs-grid>.col.center .muted,.motto p,.fb small{color:var(--on-muted)}
.mhead,.votes .mid{color:var(--on)}
.kfoot{color:#6EE7B7}
.fb .good{color:#34D399}.fb .bad{color:#C4B5FD}
.timer .num{color:var(--on)}.timer .lbl{color:var(--on-muted)}
.timer .bg{stroke:rgba(148,163,255,.22)}
.timer .fg{stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(34,211,238,.8))}
.bubbles{background:rgba(255,255,255,.04);border-color:rgba(34,211,238,.45)}
.slot{background:rgba(255,255,255,.05);border-color:rgba(34,211,238,.45)}
.slot .muted{color:var(--on-muted)!important}
.slot .n{background:rgba(34,211,238,.7)}
.slot.fill{background:#fff}
.slot.fill .n{background:var(--p)}
.marr,.farrow{color:var(--cyan)}
.dots i{background:rgba(148,163,255,.3)}
.map line{stroke:rgba(103,232,249,.55)}
.mcore{background:radial-gradient(circle at 35% 30%,#A78BFA,#7C5CFF 50%,#4338CA);box-shadow:0 0 60px rgba(124,92,255,.7),0 0 0 12px rgba(34,211,238,.12)}
.qnum{background:linear-gradient(90deg,#F59E0B,#F472B6)}
.story .rv.key{background:linear-gradient(90deg,#7C5CFF,#0891B2)}
.tps-q{background:linear-gradient(90deg,#6D28D9,#0E7490)}
.motto h2{background:linear-gradient(90deg,#67E8F9,#A78BFA 50%,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.mstep.cur{background:linear-gradient(135deg,#7C5CFF,#06B6D4)}
.blank.on{background:linear-gradient(90deg,#7C5CFF,#06B6D4)}
/* نافذة فيديو الترحيب */
#vidModal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(20,6,50,.82);backdrop-filter:blur(8px)}
#vidModal.show{display:flex;animation:inFade .35s ease both}
#vidModal .vbox{position:relative;width:min(1100px,90vw);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#000}
#vidModal video{display:block;width:100%;max-height:80vh}
#vidModal .vclose{position:absolute;top:12px;left:12px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div id="stage">
  <div id="progress"></div>
  <div id="slides"></div>
</div>

<!-- شريط التحكم أسفل الشاشة -->
<nav id="controls" aria-label="التحكم في العرض">
  <button id="btnPrev" title="السابق (←)">← السابق</button>
  <span id="counter">1 / 1</span>
  <button id="btnNext" title="التالي (→ أو Space)">التالي →</button>
  <button id="btnClap" title="تصفيق (ت)">👏</button>
  <button id="btnFull" title="ملء الشاشة (F)">⛶</button>
  <button id="btnNotes" title="ملاحظات المعلمة (N)">📝</button>
</nav>

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const pastel = ['#EDE9FE','#FCE7F3','#E0F2FE','#D1FAE5','#FEF3C7','#FFE4E6'];
const pastelInk = ['#5B21B6','#9D174D','#0369A1','#047857','#B45309','#BE123C'];

function toast(msg, ms=2200){
  const t=$('#toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms);
}

/* ==========================================================================
   🔊 الأصوات (Web Audio API — بدون ملفات خارجية)
   ========================================================================== */
const Sound = {
  ctx:null,
  ac(){ if(!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  noise(){ // مخزن ضوضاء يُعاد استخدامه
    if(this._nb) return this._nb;
    const c=this.ac(), b=c.createBuffer(1, c.sampleRate*0.25, c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return this._nb=b;
  },
  tone(f, t0, dur, type='sine', vol=.18){
    const c=this.ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.015); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  /* تصفيق: مجموعة نقرات ضوضاء قصيرة عشوائية التوقيت */
  clap(){
    const c=this.ac(), now=c.currentTime, buf=this.noise();
    const master=c.createGain(); master.gain.value=.9; master.connect(c.destination);
    for(let i=0;i<34;i++){
      const t=now + Math.random()*1.5 * Math.pow(Math.random(), .5);
      const s=c.createBufferSource(); s.buffer=buf;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900+Math.random()*1600; bp.Q.value=.9;
      const g=c.createGain(); const v=.25+Math.random()*.45;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.002); g.gain.exponentialRampToValueAtTime(.001,t+.06+Math.random()*.05);
      s.connect(bp).connect(g).connect(master);
      s.start(t, Math.random()*.15, .14);
    }
  },
  success(){ const t=this.ac().currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.09,.35,'triangle',.2)); },
  wrong(){ const t=this.ac().currentTime; this.tone(330,t,.22,'sine',.16); this.tone(262,t+.16,.3,'sine',.16); },
  tick(){ this.tone(1200,this.ac().currentTime,.06,'square',.05); },
  pop(){ this.tone(880,this.ac().currentTime,.09,'sine',.12); },
  bell(){ const t=this.ac().currentTime; [880,1318.5,1760].forEach((f,i)=>this.tone(f,t+i*.18,1.1,'sine',.18)); }
};

/* ==========================================================================
   🎉 المؤثرات البصرية: قصاصات احتفالية + تصفيق طائر
   ========================================================================== */
const FX = (() => {
  const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], running=false;
  const colors=['#7C5CFF','#22D3EE','#F472B6','#FBBF24','#34D399','#A78BFA'];
  function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
  addEventListener('resize', size); size();
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(p => p.life>0);
    for(const p of parts){
      p.vy+=.25*devicePixelRatio; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      cx.save(); cx.globalAlpha=Math.min(1,p.life/40); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();
    }
    if(parts.length) requestAnimationFrame(loop); else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
  }
  function confetti(n=140){
    const d=devicePixelRatio;
    for(let i=0;i<n;i++){
      const side=i%2;
      parts.push({ x: side? cv.width*.15 : cv.width*.85, y: cv.height*.7,
        vx:(side?1:-1)*(4+Math.random()*9)*d, vy:-(10+Math.random()*12)*d,
        s:(10+Math.random()*10)*d, rot:Math.random()*6, vr:(Math.random()-.5)*.4,
        c:colors[i%colors.length], life:110+Math.random()*50 });
    }
    if(!running){ running=true; loop(); }
  }
  function claps(fromEl){
    const r=(fromEl||$('#btnClap')).getBoundingClientRect(), layer=$('#clapLayer');
    for(let i=0;i<16;i++){
      const s=document.createElement('span'); s.className='clap-fly'; s.textContent=['👏','👏','👏','💜','⭐'][i%5];
      s.style.left=(r.left+r.width/2-20+(Math.random()-.5)*60)+'px'; s.style.top=(r.top-10)+'px';
      s.style.setProperty('--x', ((Math.random()-.5)*360)+'px');
      s.style.setProperty('--r', ((Math.random()-.5)*60)+'deg');
      s.style.setProperty('--t', (1.3+Math.random()*1)+'s');
      s.style.animationDelay=(Math.random()*.4)+'s';
      layer.appendChild(s); setTimeout(()=>s.remove(), 2900);
    }
  }
  return {confetti, claps};
})();

function clap(){ Sound.clap(); FX.claps(); }
function celebrate(){ Sound.success(); FX.confetti(); }

/* تحويل النص إلى كلام */
function say(text, lang='ar-SA'){
  if(!('speechSynthesis' in window)) return toast('المتصفح لا يدعم النطق 😔');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2))); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

function timerHTML(sec, label='', small=false){
  return `<div class="timer${small?' sm':''}" data-sec="${sec}">
    ${label?`<div class="lbl">${label}</div>`:''}
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52"/></svg><div class="num">${mmss(sec)}</div></div>
    <div class="tb"><button class="btn sm t-play">▶ ابدئي</button><button class="btn soft sm t-reset">🔄</button></div>
  </div>`;
}
function mountTimer(el, slideCtx){
  const C=2*Math.PI*52, fg=$('.fg',el), num=$('.num',el), play=$('.t-play',el);
  let total=+el.dataset.sec, left=total, iv=null;
  fg.style.strokeDasharray=C;
  const draw=()=>{ num.textContent=mmss(left); fg.style.strokeDashoffset=C*(1-left/total); el.classList.toggle('warn', left<=10 && left>0); };
  const stop=()=>{ clearInterval(iv); iv=null; play.textContent='▶ ابدئي'; };
  const start=()=>{
    if(iv) return stop();
    if(left<=0) left=total;
    play.textContent='⏸ إيقاف';
    iv=setInterval(()=>{ left--; if(left<=5 && left>0) Sound.tick(); draw();
      if(left<=0){ stop(); Sound.bell(); toast('⏰ انتهى الوقت!'); } },1000);
  };
  const set=s=>{ stop(); total=left=s; draw(); };
  play.onclick=start; $('.t-reset',el).onclick=()=>set(total);
  draw(); slideCtx.onLeave.push(stop);
  el._timer={start,stop,set};
}

function mountReveal(scope, btn, onDone){

  /* ---------- مختبر تعلّم الآلة ---------- */
  mllab:{
    html:s=>`${head(s)}<div class="s-body"><div class="lab">
      <div class="lab-canvas st"><canvas width="954" height="560"></canvas>
        <div class="axis-x">عدد الروابط في الرسالة 🔗 ←</div>
        <div class="axis-y">كلمات مثل: ربحتِ، مجانًا، جائزة ↑</div></div>
      <div class="col">
        <div class="mode-btns st"><button class="mode spam on" data-m="1">🚫 احتيالية</button><button class="mode ham" data-m="0">✅ سليمة</button><button class="mode test" data-m="t">🔮 اختبري</button></div>
        <div class="lab-info st">1️⃣ اختاري النوع وانقري على اللوحة لتعليم الآلة.<br>2️⃣ اختاري <b>🔮 اختبري</b> وانقري رسالة جديدة!<br>📊 تعلّمت الآلة من <b class="cnt">0</b> مثال.</div>
        <div class="pred st">🤖 علّميني أولًا..</div>
        <div class="lab-tools st"><button class="btn sm soft sample">🎲 أمثلة جاهزة</button><button class="btn sm rose bad">⚠️ بيانات خاطئة</button><button class="btn sm soft clear">🗑️ مسح</button></div>
        <div class="lab-info st" style="font-size:25px;background:var(--amber-l)">💡 لم يكتب أحد القاعدة! الآلة استنتجتها من الأمثلة — مثل مجلد البريد العشوائي (Junk) في Outlook 📧</div>
      </div></div></div>`,
    init:(el,s,ctx)=>{
      const cv=$('canvas',el), g=cv.getContext('2d'), W=cv.width, H=cv.height;
      let pts=[], mode='1', test=null;
      const knn=(x,y)=>{ const k=Math.min(3,pts.length);
        const near=pts.map(p=>({l:p.l,d:(p.x-x)**2+(p.y-y)**2})).sort((a,b)=>a.d-b.d).slice(0,k);
        const spam=near.filter(p=>p.l===1).length; return {l:spam*2>k?1:spam*2<k?0:near[0].l, conf:Math.round(Math.max(spam,k-spam)/k*100)}; };
      const draw=()=>{
        g.clearRect(0,0,W,H);
        if(pts.length){ const c=18; for(let x=0;x<W;x+=c) for(let y=0;y<H;y+=c){ const r=knn((x+c/2)/W,(y+c/2)/H);
          g.fillStyle=r.l?'rgba(244,63,94,.15)':'rgba(16,185,129,.15)'; g.fillRect(x,y,c,c); } }
        g.strokeStyle='rgba(124,58,237,.12)'; g.lineWidth=1;
        for(let x=0;x<=W;x+=W/10){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
        for(let y=0;y<=H;y+=H/8){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
        g.textAlign='center'; g.textBaseline='middle'; g.font='30px sans-serif';
        for(const p of pts){ g.beginPath(); g.arc(p.x*W,p.y*H,20,0,7); g.fillStyle=p.l?'#F43F5E':'#10B981'; g.fill();
          g.lineWidth=4; g.strokeStyle='#fff'; g.stroke(); g.fillStyle='#fff'; g.font='bold 24px sans-serif'; g.fillText(p.l?'✕':'✓',p.x*W,p.y*H+1); }
        if(test){ g.font='54px sans-serif'; g.fillText('✉️',test.x*W,test.y*H); }
        $('.cnt',el).textContent=pts.length;
      };
      const predict=()=>{ if(!test) return; const p=$('.pred',el);
        if(!pts.length){ p.textContent='🤖 لا أعرف! لم تعلّميني أي مثال بعد 😅'; return; }
        const r=knn(test.x,test.y);
        p.innerHTML=r.l?`🤖 أتوقع: <span style="color:var(--rose)">رسالة احتيالية 🚫</span> (${r.conf}%)`:`🤖 أتوقع: <span style="color:#059669">رسالة سليمة ✅</span> (${r.conf}%)`;
        p.style.animation='none'; p.offsetWidth; p.style.animation='pop .4s both'; Sound.pop(); };
      cv.onclick=e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
        if(mode==='t'){ test={x,y}; draw(); predict(); } else { pts.push({x,y,l:+mode}); Sound.tick(); draw(); predict(); } };
      $$('.mode',el).forEach(b=>b.onclick=()=>{ $$('.mode',el).forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; });
      const rnd=(a,b)=>a+Math.random()*(b-a);
      $('.sample',el).onclick=()=>{ for(let i=0;i<9;i++){ pts.push({x:rnd(.55,.95),y:rnd(.06,.5),l:1}); pts.push({x:rnd(.05,.45),y:rnd(.5,.94),l:0}); } draw(); predict(); Sound.pop(); };
      $('.bad',el).onclick=()=>{ for(let i=0;i<7;i++) pts.push({x:rnd(.6,.9),y:rnd(.1,.4),l:0}); draw(); predict(); Sound.wrong();
        toast('⚠️ بيانات خاطئة = نتائج خاطئة! تخيّلي ذلك في التشخيص الطبي 🩺', 3500); };
      $('.clear',el).onclick=()=>{ pts=[]; test=null; draw(); $('.pred',el).textContent='🤖 علّميني أولًا..'; };
      draw();
    }
  },

  steps:{
    html:s=>`${head(s)}<div class="s-body">
      <div class="mlpipe st">${s.steps.map((x,i)=>`${i?'<span class="marr">⬅</span>':''}<button class="mstep" data-i="${i}"><span class="mk">${i+1}</span><span class="mi">${x.i}</span><span class="mn">${x.t}</span></button>`).join('')}</div>

    init:(el,s)=>{

      const go=i=>{ cur=Math.max(0,Math.min(s.steps.length-1,i)); const x=s.steps[cur];
        btns.forEach((b,k)=>{ b.classList.toggle('cur',k===cur); b.classList.toggle('done',k<cur); });
        show.innerHTML=`<div class="mhead">${x.i} الخطوة ${cur+1}: ${x.t}</div>
          <div class="mdetail">
            <div class="mbox" style="--c:var(--p)"><h4>💡 ماذا تعني؟</h4><p>${x.d}</p></div>
            <div class="mbox" style="--c:var(--rose)"><h4>📧 في مثال الرسائل الاحتيالية</h4><p>${x.ex}</p></div>
            <div class="mbox" style="--c:var(--amber)"><h4>🍳 مثل الطبخ</h4><p>${x.a}</p></div>
          </div>`;
        $('.mprev',el).disabled=cur===0;
        $('.mnext',el).textContent=cur===s.steps.length-1?'🎉 أنهينا الخطوات':'الخطوة التالية ⬅';
        Sound.pop(); };
      btns.forEach(b=>b.onclick=()=>go(+b.dataset.i));
      $('.mprev',el).onclick=()=>go(cur-1);

    init:(el,s)=>{

      const place=i=>{ const st=s.steps[i]; slots[i].classList.add('fill');

      const reset=()=>{ next=0; pool.innerHTML=shuffle(s.steps.map((x,idx)=>({...x,idx}))).map(x=>`<button class="chipbtn" data-i="${x.idx}">${x.i} ${x.t}</button>`).join('');
        slots.forEach((sl,i)=>{ sl.classList.remove('fill'); sl.innerHTML=`<span class="n">${i+1}</span><span class="muted" style="font-size:44px">؟</span>`; });
        $$('.chipbtn',pool).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i;

      $('.again',el).onclick=reset;

    init:(el,s,ctx)=>{
      const out=$('.sr-text',el), wrap=$('.sr',el); let rec=null;
      const set=t=>{ out.textContent=t; };
      const sim=()=>{ wrap.classList.add('listening'); set('...'); let i=0;

/* ==========================================================================
   🎬 محرك التنقل بين الشرائح
   ========================================================================== */
const Deck = {
  els:[], ctx:[], cur:-1,
  build(){
    const root=$('#slides');
    SLIDES.forEach((s,i)=>{
      const t=T[s.type] || { html:()=>`<h2 class="s-title">⚠️ نوع شريحة غير معروف: ${esc(s.type)}</h2>` };
      const el=document.createElement('section'); el.className='slide'; el.dataset.anim=s.anim||'fade';
      el.innerHTML=t.html(s);
      $$('.st',el).forEach((x,k)=>x.style.setProperty('--d',k));
      root.appendChild(el);
      const ctx={onLeave:[], keys:null, s};
      // عناصر «اضغطي لتظهر» العامة
      $$('.peek',el).forEach(p=>{ p.tabIndex=0; const f=()=>{ p.classList.toggle('open'); Sound.pop(); }; p.addEventListener('click',f); p.addEventListener('keydown',e=>{ if(e.key==='Enter') f(); }); });
      t.init && t.init(el, s, ctx);
      if(s.audio){ const au=new Audio(s.audio); au.preload='auto'; ctx.audio=au;
        ctx.onLeave.push(()=>{ au.pause(); au.currentTime=0; }); }
      this.els.push(el); this.ctx.push(ctx);
    });
    const start=parseInt(location.hash.slice(1),10);
    this.go(isNaN(start)?0:start-1, true);
  },
  go(n, first=false){
    n=Math.max(0, Math.min(this.els.length-1, n));
    if(n===this.cur) return;
    const fwd=n>this.cur, old=this.els[this.cur], nu=this.els[n];
    if(old){ this.ctx[this.cur].onLeave.forEach(f=>f()); old.classList.remove('active','enter-fade','enter-zoom','enter-slide','fwd','back');
      old.classList.add('leaving'); setTimeout(()=>old.classList.remove('leaving'),460); }
    if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
    nu.classList.remove('leaving'); nu.classList.add('active', 'enter-'+nu.dataset.anim, fwd?'fwd':'back');
    this.cur=n;
    const au=this.ctx[n].audio;
    if(au){ au.currentTime=0; au.play().catch(()=>{   // المتصفح يمنع التشغيل قبل أول تفاعل
      toast('🔊 اضغطي في أي مكان لتشغيل الصوت',3000);
      addEventListener('pointerdown',()=>{ if(this.cur===n) au.play().catch(()=>{}); },{once:true}); }); }
    $('#counter').textContent=`${n+1} / ${this.els.length}`;
    $('#progress').style.width=((n+1)/this.els.length*100)+'%';
    history.replaceState(null,'','#'+(n+1));
    $('#btnPrev').disabled = n===0; $('#btnNext').disabled = n===this.els.length-1;
    this.renderNotes();
  },
  next(){ this.go(this.cur+1); },
  prev(){ this.go(this.cur-1); },
  renderNotes(){ const s=SLIDES[this.cur]; $('#notes').innerHTML=`<h4>📝 ملاحظات للمعلمة — الشريحة ${this.cur+1}</h4>${s.notes||'لا توجد ملاحظات لهذه الشريحة.'}`; }
};

/* ---------- تكبير المسرح ليملأ الشاشة بنسبة 16:9 ---------- */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); $('#stage').style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- فيديو الترحيب: يُفتح في نافذة وعند انتهائه ننتقل للشريحة التالية ---------- */
function playWelcomeVideo(){
  let m=$('#vidModal');
  if(!m){
    m=document.createElement('div'); m.id='vidModal';
    m.innerHTML='<div class="vbox"><button class="vclose" title="إغلاق (Esc)">✕</button><video src="welcome.MP4" playsinline controls></video></div>';
    document.body.appendChild(m);
    const v=$('video',m);
    $('.vclose',m).onclick=()=>closeWelcomeVideo();
    m.onclick=e=>{ if(e.target===m) closeWelcomeVideo(); };
    v.onended=()=>{ closeWelcomeVideo(); Deck.next(); };
  }
  const v=$('video',m); v.currentTime=0; m.classList.add('show');
  v.play().catch(()=>{});
}
function closeWelcomeVideo(){ const m=$('#vidModal'); if(!m) return; $('video',m).pause(); m.classList.remove('show'); }

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(typing){ if(e.key==='Escape') e.target.blur(); return; }   // لا نتدخل أثناء الكتابة
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const vm=$('#vidModal');
  if(vm && vm.classList.contains('show')){   // أثناء عرض الفيديو: لا تنقّل بين الشرائح
    if(e.key==='Escape') closeWelcomeVideo();
    else if(e.key===' '){ e.preventDefault(); const v=$('video',vm); v.paused?v.play():v.pause(); }
    return;
  }
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); Deck.next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); Deck.prev(); }
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); }
  else if(k==='Home'){ e.preventDefault(); Deck.go(0); }
  else if(k==='End'){ e.preventDefault(); Deck.go(Deck.els.length-1); }
  else if(k==='ت'||e.code==='KeyJ'){ e.preventDefault(); clap(); }
  else if(e.code==='KeyF'){ toggleFull(); }
  else if(e.code==='KeyN'){ $('#notes').classList.toggle('show'); }
  else { const c=Deck.ctx[Deck.cur]; if(c && c.keys && c.keys(k)) e.preventDefault(); }
});

/* ---------- 🧠 خلفية «شبكة عصبية» تتحرك بهدوء خلف الشرائح ---------- */
(function neuralBackground(){
  const cv=document.createElement('canvas'); cv.id='neural'; cv.width=1920; cv.height=1080;
  $('#stage').insertBefore(cv, $('#slides'));
  const g=cv.getContext('2d'), N=46, LINK=230;
  const pts=Array.from({length:N},()=>({x:Math.random()*1920, y:Math.random()*1080, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:1.5+Math.random()*2.5}));
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches; let last=0;
  function frame(t){
    if(!still) requestAnimationFrame(frame);
    if(t-last<33) return; last=t;                       // نحو 30 إطارًا في الثانية لتخفيف الحمل
    g.clearRect(0,0,1920,1080);
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>1920) p.vx*=-1; if(p.y<0||p.y>1080) p.vy*=-1; }
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ const a=pts[i], b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<LINK){ g.strokeStyle=`rgba(103,232,249,${(1-d/LINK)*.35})`; g.lineWidth=1; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
    for(const p of pts){ g.fillStyle='rgba(167,139,250,.9)'; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); }
  }
  requestAnimationFrame(frame);
})();

Deck.build();
</script>
